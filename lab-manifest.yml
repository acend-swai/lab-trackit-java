# Lab content manifest - source of truth for what each branch of this repo must and
# must not contain. Same mechanism as acend-swai/lab-trackit, validated by
# scripts/validate_lab_branches.py (copied from inc-edu-sweai).
#
# WHY: start branches are hand-authored snapshots and drift silently. A branch that
# ships a file the lab has participants create turns the lab into a read-along.
#
#   must_exist     - scaffold the lab treats as already there
#   must_not_exist - files the lab has the participant create
#
# When a lab changes what it creates or reads, UPDATE THIS FILE.

branches:
  m1-1-start:
    role: starting point for lab 1, module M1.1 - ships the context file the grounded-prompt half of the lab points at
    must_exist:
      - LAB.md
      - CHEATSHEET.md
      - README.md
      - verify.sh
      - lab-manifest.yml
      - .env.example
      - .devcontainer/devcontainer.json
      - .devcontainer/post-create.sh
      - AGENTS.md
      - CLAUDE.md
      - opencode.json
      - docs/architecture.md
      - docs/adr/0001-layered-spring-architecture.md
      - backend/pom.xml
      - backend/mvnw
      - backend/src/main/resources/application.yml
      - backend/src/main/java/ch/acend/trackit/TrackitApplication.java
      - backend/src/main/java/ch/acend/trackit/web/HealthController.java
      - backend/src/test/java/ch/acend/trackit/web/HealthControllerTest.java
    must_not_exist:
      - backend/src/main/java/ch/acend/trackit/domain/Task.java
      - backend/src/main/java/ch/acend/trackit/domain/TaskStatus.java
      - backend/src/main/java/ch/acend/trackit/dto/CreateTaskRequest.java
      - backend/src/main/java/ch/acend/trackit/service/TaskService.java
      - backend/src/main/java/ch/acend/trackit/web/TaskController.java
      - backend/src/test/java/ch/acend/trackit/web/TaskControllerTest.java

  m1-1-solution:
    role: reference state after lab 1
    must_exist:
      - LAB.md
      - CHEATSHEET.md
      - AGENTS.md
      - CLAUDE.md
      - backend/src/main/java/ch/acend/trackit/domain/Task.java
      - backend/src/main/java/ch/acend/trackit/domain/TaskStatus.java
      - backend/src/main/java/ch/acend/trackit/dto/CreateTaskRequest.java
      - backend/src/main/java/ch/acend/trackit/service/TaskService.java
      - backend/src/main/java/ch/acend/trackit/web/TaskController.java
      - backend/src/test/java/ch/acend/trackit/web/TaskControllerTest.java
      - backend/src/main/java/ch/acend/trackit/web/HealthController.java

  m1-2-start:
    role: starting point for lab 1.2 - the M1.1 solution plus everything the standard path USES but does not write. The two house-pattern skills are given, so no participant has to author a skill or an agent to finish Parts 1 and 2. What the lab has them build stays out.
    must_exist:
      - LAB.md
      - CHEATSHEET.md
      - README.md
      - verify.sh
      - lab-manifest.yml
      - compose.yaml
      - .env.example
      - .gitignore
      - .devcontainer/devcontainer.json
      - .devcontainer/post-create.sh
      - AGENTS.md
      - CLAUDE.md
      - opencode.json
      - docs/architecture.md
      - docs/adr/0001-layered-spring-architecture.md
      - docs/mcp-candidates.md
      - sandbox/.gitkeep
      - .claude/skills/commit-message/SKILL.md
      - .claude/skills/add-persistence/SKILL.md
      - .claude/skills/add-view/SKILL.md
      - .claude/agents/api-reviewer.md
      - backend/pom.xml
      - backend/src/main/java/ch/acend/trackit/domain/Task.java
      - backend/src/main/java/ch/acend/trackit/domain/TaskStatus.java
      - backend/src/main/java/ch/acend/trackit/dto/CreateTaskRequest.java
      - backend/src/main/java/ch/acend/trackit/service/TaskService.java
      - backend/src/main/java/ch/acend/trackit/web/TaskController.java
      - backend/src/main/java/ch/acend/trackit/web/HealthController.java
      - backend/src/test/java/ch/acend/trackit/web/TaskControllerTest.java
      - frontend/package.json
      - frontend/package-lock.json
      - frontend/vite.config.ts
      - frontend/tsconfig.json
      - frontend/index.html
      - frontend/src/main.ts
      - frontend/src/App.vue
      - frontend/src/api/client.ts
      - frontend/src/router/index.ts
      - frontend/src/views/HomeView.vue
    must_not_exist:
      # task 3 - the standard path builds persistence with the given skill
      - backend/src/main/java/ch/acend/trackit/domain/TaskEntity.java
      - backend/src/main/java/ch/acend/trackit/repository/TaskRepository.java
      - backend/src/main/resources/db/migration/V1__create_task.sql
      # task 4 - the standard path builds the task board with the given skill
      - frontend/src/api/tasks.ts
      - frontend/src/views/TaskBoardView.vue
      # tasks 5 and 6
      - .mcp.json
      - docs/mcp-scoping.md
      # advanced only - A1 writes this skill, A2 writes these two agents
      - .claude/skills/add-endpoint/SKILL.md
      - .claude/agents/db-builder.md
      - .claude/agents/frontend-builder.md

  m1-2-mid:
    role: rejoin point inside lab 1.2 - the state after task 4, with the database and the task board built by the given skills, before any MCP work. Carries no advanced artefact.
    must_exist:
      - LAB.md
      - CHEATSHEET.md
      - .claude/skills/add-persistence/SKILL.md
      - .claude/skills/add-view/SKILL.md
      - .claude/skills/commit-message/SKILL.md
      - .claude/agents/api-reviewer.md
      - compose.yaml
      - backend/src/main/java/ch/acend/trackit/domain/TaskEntity.java
      - backend/src/main/java/ch/acend/trackit/repository/TaskRepository.java
      - backend/src/main/resources/db/migration/V1__create_task.sql
      - frontend/src/api/tasks.ts
      - frontend/src/views/TaskBoardView.vue
    must_not_exist:
      - .mcp.json
      - docs/mcp-scoping.md
      - frontend/src/views/HomeView.vue
      - .claude/skills/add-endpoint/SKILL.md
      - .claude/agents/db-builder.md
      - .claude/agents/frontend-builder.md

  m1-2-solution:
    role: reference state after lab 1.2 - the standard path complete (tasks in PostgreSQL, task board, one scoped MCP server) plus the advanced DEFINITIONS as reference. The advanced code changes are deliberately absent, so the application state equals what the standard path produces.
    must_exist:
      - LAB.md
      - CHEATSHEET.md
      - .claude/skills/add-persistence/SKILL.md
      - .claude/skills/add-view/SKILL.md
      - .claude/skills/add-endpoint/SKILL.md
      - .claude/skills/commit-message/SKILL.md
      - .claude/agents/db-builder.md
      - .claude/agents/frontend-builder.md
      - .claude/agents/api-reviewer.md
      - .mcp.json
      - docs/mcp-scoping.md
      - compose.yaml
      - backend/src/main/java/ch/acend/trackit/domain/TaskEntity.java
      - backend/src/main/java/ch/acend/trackit/repository/TaskRepository.java
      - backend/src/main/resources/db/migration/V1__create_task.sql
      - frontend/src/api/tasks.ts
      - frontend/src/views/TaskBoardView.vue
    must_not_exist:
      - frontend/src/views/HomeView.vue
      - backend/src/main/java/ch/acend/trackit/web/TaskNotFoundException.java

  m2-start:
    role: starting point for lab 2, module M2 - the lab 1.2 solution plus the lab 2 handout. OpenSpec is installed during the lab, so nothing under openspec/ ships here.
    must_exist:
      - LAB.md
      - CHEATSHEET.md
      - .claude/skills/add-persistence/SKILL.md
      - .claude/skills/add-view/SKILL.md
      - .claude/agents/db-builder.md
      - .claude/agents/frontend-builder.md
      - .mcp.json
      - docs/mcp-scoping.md
      - compose.yaml
      - backend/src/main/java/ch/acend/trackit/domain/TaskEntity.java
      - backend/src/main/resources/db/migration/V1__create_task.sql
      - frontend/src/api/tasks.ts
      - frontend/src/views/TaskBoardView.vue
    must_not_exist:
      # task 1 installs OpenSpec, tasks 3 to 6 produce everything under openspec/
      - openspec/specs/task-comments/spec.md
      # tasks 3 to 5 build the comment feature
      - backend/src/main/java/ch/acend/trackit/domain/Comment.java
      - backend/src/main/java/ch/acend/trackit/domain/CommentEntity.java
      - backend/src/main/java/ch/acend/trackit/repository/CommentRepository.java
      - backend/src/main/java/ch/acend/trackit/service/CommentService.java
      - backend/src/main/java/ch/acend/trackit/dto/CreateCommentRequest.java
      - backend/src/main/java/ch/acend/trackit/web/CommentController.java
      - backend/src/main/resources/db/migration/V2__create_comment.sql
      - backend/src/test/java/ch/acend/trackit/web/CommentControllerTest.java

  m2-solution:
    role: reference state after lab 2 - task comments, specified before written. Carries the archived change and the merged live spec, which is the artefact the module is actually about.
    must_exist:
      - LAB.md
      - CHEATSHEET.md
      - openspec/specs/task-comments/spec.md
      - openspec/changes/archive/2026-09-08-add-task-comments/proposal.md
      - openspec/changes/archive/2026-09-08-add-task-comments/tasks.md
      - openspec/changes/archive/2026-09-08-add-task-comments/specs/task-comments/spec.md
      - backend/src/main/java/ch/acend/trackit/domain/Comment.java
      - backend/src/main/java/ch/acend/trackit/domain/CommentEntity.java
      - backend/src/main/java/ch/acend/trackit/repository/CommentRepository.java
      - backend/src/main/java/ch/acend/trackit/service/CommentService.java
      - backend/src/main/java/ch/acend/trackit/dto/CreateCommentRequest.java
      - backend/src/main/java/ch/acend/trackit/web/CommentController.java
      - backend/src/main/java/ch/acend/trackit/web/TaskNotFoundException.java
      - backend/src/main/resources/db/migration/V2__create_comment.sql
      - backend/src/test/java/ch/acend/trackit/web/CommentControllerTest.java
    must_not_exist:
      - deploy/terraform/main.tf
      - .claude/settings.json
      - .claude/hooks/check-infra.sh

  m3-start:
    role: starting point for lab 3, module M3 - the lab 2 solution plus the lab 3 handout. Everything the lab hardens or generates is absent.
    must_exist:
      - LAB.md
      - CHEATSHEET.md
      - openspec/specs/task-comments/spec.md
      - backend/src/main/java/ch/acend/trackit/web/CommentController.java
      - backend/src/main/resources/db/migration/V2__create_comment.sql
      - compose.yaml
      - .mcp.json
    must_not_exist:
      # task 1 writes the deny rules
      - .claude/settings.json
      # task 2 writes the hook
      - .claude/hooks/check-infra.sh
      # task 4 generates the infrastructure
      - deploy/terraform/main.tf
      - deploy/terraform/variables.tf
      - deploy/terraform/versions.tf
      - deploy/terraform/outputs.tf

  m3-solution:
    role: reference state after lab 3 - deny rules, a PreToolUse hook that fails closed, the Terraform MCP server connected, and a configuration that passes terraform validate. Nothing is applied.
    must_exist:
      - LAB.md
      - CHEATSHEET.md
      - .claude/settings.json
      - .claude/hooks/check-infra.sh
      - .mcp.json
      - deploy/terraform/versions.tf
      - deploy/terraform/variables.tf
      - deploy/terraform/main.tf
      - deploy/terraform/outputs.tf
      - deploy/terraform/terraform.tfvars.example
      - openspec/specs/task-comments/spec.md
    must_not_exist:
      # the credential never lands in a file, in this repo or any participant's
      - deploy/terraform/terraform.tfvars

  m4-full-agentic:
    role: standalone branch on top of m3-solution (carries M1.1, M1.2, M2 and M3 in full) - Stufe 4, full-agentic. Spec-first feature work under a named agent roster shared with GitHub Copilot, a Definition-of-Done gate enforced in CI, CODEOWNERS protecting the harness and infrastructure from an agent's own edits, and a merge to main publishing a container image - never applying Terraform (docs/adr/0002, docs/adr/0003). Sits outside the m1-m4 module sequence.
    must_exist:
      # inherited from m3-solution - confirms the base, not a lesser one
      - .claude/settings.json
      - .claude/hooks/check-infra.sh
      - .mcp.json
      - deploy/terraform/main.tf
      - openspec/specs/task-comments/spec.md
      # capstone docs
      - docs/adr/0002-full-agentic-capstone-platform.md
      - docs/adr/0003-agent-security-boundary.md
      - SECURITY.md
      # the live-demo feature, specified end to end, deliberately unimplemented
      - openspec/changes/add-task-summary/proposal.md
      - openspec/changes/add-task-summary/tasks.md
      - openspec/changes/add-task-summary/specs/task-summary/spec.md
      # harness extensions
      - .claude/hooks/block-protected-edits.sh
      - .claude/hooks/run-tests.sh
      - .claude/hooks/pr-summary.sh
      - .claude/commands/spec.md
      - .claude/commands/plan.md
      - .claude/commands/adr.md
      - .claude/commands/dod-check.md
      - .claude/commands/release.md
      - .claude/agents/planner.md
      - .claude/agents/implementer.md
      - .claude/agents/tester.md
      - .claude/agents/security.md
      # GitHub Copilot parity
      - .github/copilot-instructions.md
      - .github/instructions/backend.instructions.md
      - .github/instructions/frontend.instructions.md
      - .github/instructions/infra.instructions.md
      - .github/agents/planner.agent.md
      - .github/agents/implementer.agent.md
      - .github/agents/tester.agent.md
      - .github/agents/security.agent.md
      - .github/agents/api-reviewer.agent.md
      - .github/prompts/spec.prompt.md
      - .github/prompts/plan.prompt.md
      - .github/prompts/backend-coder.prompt.md
      - .github/prompts/test-writer.prompt.md
      - .github/prompts/dod-check.prompt.md
      - .github/CODEOWNERS
      - .github/pull_request_template.md
      # CI/CD
      - .github/workflows/dod-check.yml
      - .github/workflows/agent-parity.yml
      - .github/workflows/copilot-setup-steps.yml
      - .github/workflows/deploy.yml
      - .githooks/pre-push
      - scripts/dod_check.sh
      - scripts/check_agent_parity.sh
    must_not_exist:
      # docs/adr/0002: this feature stays unimplemented - it is the live-demo
      # slice a full-agentic run builds, not a pre-baked diff.
      - backend/src/main/java/ch/acend/trackit/web/TaskSummaryController.java
      # db-builder/frontend-builder are Claude-Code-only by design (docs/adr/0002)
      # and are never mirrored for Copilot's single cloud agent.
      - .github/agents/db-builder.agent.md
      - .github/agents/frontend-builder.agent.md
