# Lab content manifest - source of truth for what each branch of this repo must and
# must not contain. Same mechanism as acend-swai/lab-trackit, validated by
# scripts/validate_lab_branches.py (copied from inc-edu-sweai).
#
# WHY: start branches are hand-authored snapshots and drift silently. A branch that
# ships a file the lab has participants create turns the lab into a read-along.
#
#   must_exist     - scaffold the lab treats as already there
#   must_not_exist - files the lab has the participant create
#
# When a lab changes what it creates or reads, UPDATE THIS FILE.

branches:
  m1-1-start:
    role: starting point for lab 1, module M1.1 - ships the context file the grounded-prompt half of the lab points at
    must_exist:
      - README.md
      - verify.sh
      - lab-manifest.yml
      - .env.example
      - .devcontainer/devcontainer.json
      - .devcontainer/post-create.sh
      - AGENTS.md
      - CLAUDE.md
      - opencode.json
      - docs/architecture.md
      - docs/adr/0001-layered-spring-architecture.md
      - backend/pom.xml
      - backend/mvnw
      - backend/src/main/resources/application.yml
      - backend/src/main/java/ch/incratec/trackit/TrackitApplication.java
      - backend/src/main/java/ch/incratec/trackit/web/HealthController.java
      - backend/src/test/java/ch/incratec/trackit/web/HealthControllerTest.java
    must_not_exist:
      - backend/src/main/java/ch/incratec/trackit/domain/Task.java
      - backend/src/main/java/ch/incratec/trackit/domain/TaskStatus.java
      - backend/src/main/java/ch/incratec/trackit/dto/CreateTaskRequest.java
      - backend/src/main/java/ch/incratec/trackit/service/TaskService.java
      - backend/src/main/java/ch/incratec/trackit/web/TaskController.java
      - backend/src/test/java/ch/incratec/trackit/web/TaskControllerTest.java

  m1-1-solution:
    role: reference state after lab 1
    must_exist:
      - AGENTS.md
      - CLAUDE.md
      - backend/src/main/java/ch/incratec/trackit/domain/Task.java
      - backend/src/main/java/ch/incratec/trackit/domain/TaskStatus.java
      - backend/src/main/java/ch/incratec/trackit/dto/CreateTaskRequest.java
      - backend/src/main/java/ch/incratec/trackit/service/TaskService.java
      - backend/src/main/java/ch/incratec/trackit/web/TaskController.java
      - backend/src/test/java/ch/incratec/trackit/web/TaskControllerTest.java
      - backend/src/main/java/ch/incratec/trackit/web/HealthController.java

  m1-2-start:
    role: starting point for lab 2, module M1.2 - the M1.1 solution, the given skill and agent, and the MCP server shortlist
    must_exist:
      - AGENTS.md
      - CLAUDE.md
      - .claude/skills/commit-message/SKILL.md
      - .claude/agents/api-reviewer.md
      - docs/mcp-candidates.md
      - sandbox/.gitkeep
      - backend/src/main/java/ch/incratec/trackit/web/TaskController.java
    must_not_exist:
      - .claude/skills/add-endpoint/SKILL.md
      - backend/src/main/java/ch/incratec/trackit/web/TaskNotFoundException.java
      - .mcp.json
      - docs/mcp-scoping.md

  m1-2-mid:
    role: rejoin point between the two lab halves - after task 2.3, before any MCP work
    must_exist:
      - .claude/skills/add-endpoint/SKILL.md
      - backend/src/main/java/ch/incratec/trackit/web/TaskNotFoundException.java
      - docs/mcp-candidates.md
    must_not_exist:
      - .mcp.json
      - docs/mcp-scoping.md

  m1-2-solution:
    role: reference state after lab 2 - features F2 and F3, own skill, second endpoint, one scoped server
    must_exist:
      - .claude/skills/add-endpoint/SKILL.md
      - .claude/skills/commit-message/SKILL.md
      - .claude/agents/api-reviewer.md
      - backend/src/main/java/ch/incratec/trackit/web/TaskNotFoundException.java
      - .mcp.json
      - docs/mcp-scoping.md
