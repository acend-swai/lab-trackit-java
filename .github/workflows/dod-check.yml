name: dod-check

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  dod-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run the Definition-of-Done gate against this PR's body
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          if [ -z "$PR_BODY" ]; then
            echo "FAIL: this PR has an empty body - fill in .github/pull_request_template.md" >&2
            exit 1
          fi
          printf '%s' "$PR_BODY" | scripts/dod_check.sh -
