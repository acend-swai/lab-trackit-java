name: agent-parity

on:
  pull_request:
    paths:
      - ".claude/agents/**"
      - ".github/agents/**"
  push:
    branches: ["**"]
    paths:
      - ".claude/agents/**"
      - ".github/agents/**"

jobs:
  agent-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Claude Code / Copilot agent mirrors are byte-identical
        run: bash scripts/check_agent_parity.sh
