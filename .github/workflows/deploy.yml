name: deploy

# Publishes a runnable image on every merge to main, and - only when Azure
# credentials are configured - shows what applying deploy/terraform/ against
# it would do. See docs/adr/0002-full-agentic-capstone-platform.md: this
# workflow NEVER runs `terraform apply`. "Written and validated, never
# applied" (AGENTS.md) holds in CI exactly as it holds for an agent in a
# terminal - applying is a decision a human makes locally, with their own
# credentials, after reviewing this plan.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.image }}
      has_azure: ${{ steps.azure.outputs.has_azure }}
    steps:
      - uses: actions/checkout@v4

      # The `secrets` context is NOT available in a job-level `if:` - that
      # conditional may only read github, needs, vars and inputs. So the
      # "are we configured for Azure?" question is answered here, in a step,
      # where secrets ARE readable, and published as a job output the
      # terraform-plan job can gate on through `needs`.
      - name: Is this fork configured for Azure?
        id: azure
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
        run: |
          if [ -n "$AZURE_CLIENT_ID" ]; then
            echo "has_azure=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_azure=false" >> "$GITHUB_OUTPUT"
            echo "No AZURE_CLIENT_ID secret - the terraform-plan job will be skipped." \
              >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run tests
        working-directory: backend
        run: ./mvnw -B test

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set the image tag
        id: image
        run: |
          repo_lower=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "image=ghcr.io/${repo_lower}-backend:${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Build and publish the image with Cloud Native Buildpacks
        working-directory: backend
        run: |
          ./mvnw -B spring-boot:build-image \
            -Dspring-boot.build-image.imageName=${{ steps.image.outputs.image }} \
            -Dspring-boot.build-image.publish=true \
            -Ddocker.publishRegistry.username=${{ github.actor }} \
            -Ddocker.publishRegistry.password=${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        run: echo "Published ${{ steps.image.outputs.image }} - no environment was touched." >> "$GITHUB_STEP_SUMMARY"

  terraform-plan:
    needs: build-and-publish
    runs-on: ubuntu-latest
    # Only attempts a plan when Azure credentials are configured as repo
    # secrets. In a training fork with none configured, this job is skipped
    # entirely - the workflow still succeeds, because publishing the image is
    # the deliverable this branch actually promises (docs/adr/0002).
    #
    # Gated on a job output, not on `secrets` directly: a job-level `if:` can
    # only read github, needs, vars and inputs, so `secrets.X != ''` here does
    # not do what it looks like it does.
    if: needs.build-and-publish.outputs.has_azure == 'true'
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - name: Azure login (OIDC, no long-lived secret)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: terraform fmt -check
        working-directory: deploy/terraform
        run: terraform fmt -check

      - name: terraform init
        working-directory: deploy/terraform
        run: terraform init -backend=false -input=false

      - name: terraform validate
        working-directory: deploy/terraform
        run: terraform validate

      - name: terraform plan (never apply)
        working-directory: deploy/terraform
        env:
          TF_VAR_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          TF_VAR_backend_image: ${{ needs.build-and-publish.outputs.image }}
          TF_VAR_db_password: ${{ secrets.TF_VAR_DB_PASSWORD }}
        run: terraform plan -input=false -no-color | tee "$GITHUB_STEP_SUMMARY"

      # No terraform apply step exists in this workflow, on purpose. A human
      # reviews the plan above and runs apply locally, with their own
      # credentials, exactly as AGENTS.md's infrastructure rules require.
